<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUSH IT UP — FVモックアップ v2(紫紺/瑠璃/アズール)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#130A24;
    --ink-soft:#1D1236;
    --murasaki-kon:#2A1750;
    --deep-purple:#4A2A8C;
    --lapis:#1E4FA6;
    --azure:#2E9BE0;
    --text-warm:#F1EEF7;
    --text-muted:#9C93B5;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; background:var(--ink);}
  body{
    color:var(--text-warm);
    font-family:'Zen Kaku Gothic New', sans-serif;
    overflow-x:hidden;
  }

  /* --- very light texture, kept subtle for a clean/mature feel --- */
  .grain{
    position:fixed; inset:0; pointer-events:none; z-index:5;
    opacity:0.02; mix-blend-mode:overlay;
  }

  /* --- smooth thermography-style glow blooms: murasaki-kon -> lapis -> azure --- */
  .glow{
    position:absolute; border-radius:50%; filter:blur(90px);
    mix-blend-mode:screen; pointer-events:none; z-index:1;
  }
  .glow-1{ width:44vw; height:44vw; background:var(--deep-purple); opacity:0.35;
    top:-12%; left:-8%; animation:drift1 24s ease-in-out infinite alternate; }
  .glow-2{ width:36vw; height:36vw; background:var(--lapis); opacity:0.30;
    bottom:-14%; right:-4%; animation:drift2 28s ease-in-out infinite alternate; }
  .glow-3{ width:24vw; height:24vw; background:var(--azure); opacity:0.22;
    top:26%; right:16%; animation:drift3 20s ease-in-out infinite alternate; }

  @keyframes drift1{ from{transform:translate(0,0);} to{transform:translate(5vw,7vh);} }
  @keyframes drift2{ from{transform:translate(0,0);} to{transform:translate(-4vw,-5vh);} }
  @keyframes drift3{ from{transform:translate(0,0);} to{transform:translate(-3vw,4vh);} }

  .hero{
    position:relative; min-height:100vh; z-index:2;
    display:flex; flex-direction:column;
    padding:clamp(20px,4vw,56px);
  }

  /* --- top bar --- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; z-index:3; }
  .mark{ display:flex; align-items:center; gap:8px; font-weight:900; font-size:17px; letter-spacing:0.01em; }
  .mark svg{ width:22px; height:22px; }
  .mark span{
    background:linear-gradient(100deg, var(--murasaki-kon) 0%, var(--deep-purple) 35%, var(--lapis) 70%, var(--azure) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .eyebrow-nav{ font-size:11px; letter-spacing:0.14em; color:var(--text-muted); font-weight:700; text-transform:uppercase; }

  /* --- main hero content --- */
  .hero-main{ flex:1; display:flex; flex-direction:column; justify-content:center; max-width:920px; z-index:3; }
  .eyebrow{
    font-size:12px; font-weight:700; letter-spacing:0.18em; color:var(--azure);
    text-transform:uppercase; margin-bottom:20px; opacity:0.9;
  }
  .headline-jp{ font-weight:900; font-size:clamp(26px, 4.6vw, 46px); line-height:1.4; margin-bottom:8px; letter-spacing:0.01em; }
  .headline-en{
    font-weight:900; font-size:clamp(40px, 9vw, 104px); line-height:1; letter-spacing:0.005em;
    background:linear-gradient(100deg, var(--murasaki-kon) 0%, var(--deep-purple) 35%, var(--lapis) 70%, var(--azure) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:8px 0 28px; min-height:1.05em;
  }
  .sub{ font-size:clamp(14px,1.6vw,17px); color:var(--text-muted); line-height:2; max-width:560px; margin-bottom:36px; font-weight:500; }
  .cta{
    display:inline-flex; align-items:center; gap:10px; width:fit-content; padding:16px 30px;
    font-weight:700; font-size:15px; color:#fff; text-decoration:none;
    background:linear-gradient(95deg, var(--lapis), var(--azure));
    border-radius:2px; transition:transform 0.25s ease, box-shadow 0.25s ease;
  }
  .cta:hover{ transform:translateY(-2px); box-shadow:0 10px 28px rgba(30,79,166,0.35); }

  .scroll-cue{
    align-self:center; margin-top:40px; z-index:3;
    font-size:10px; font-weight:700; letter-spacing:0.18em; color:var(--text-muted);
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .scroll-cue .line{ width:1px; height:34px; background:linear-gradient(var(--text-muted), transparent); animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:0.3;} 50%{opacity:1;} }

  @media (max-width:600px){ .eyebrow-nav{ display:none; } }
</style>
</head>
<body>

<svg class="grain" xmlns="http://www.w3.org/2000/svg">
  <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter>
  <rect width="100%" height="100%" filter="url(#n)"/>
</svg>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<div class="hero">
  <div class="topbar">
    <div class="mark">
      <svg viewBox="0 0 40 40" fill="none">
        <defs>
          <linearGradient id="g1" x1="0" y1="40" x2="40" y2="0">
            <stop offset="0%" stop-color="#2A1750"/>
            <stop offset="45%" stop-color="#4A2A8C"/>
            <stop offset="100%" stop-color="#2E9BE0"/>
          </linearGradient>
        </defs>
        <path d="M20 34 L20 9 M9 19 L20 7 L31 19" stroke="url(#g1)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>PUSH IT UP</span>
    </div>
    <div class="eyebrow-nav">SETAGAYA, TOKYO — EST. 2015</div>
  </div>

  <div class="hero-main">
    <div class="eyebrow">Pushitup, LLC</div>
    <h1 class="headline-jp">何事も、情熱で。</h1>
    <div class="headline-en" id="scramble">PUSH IT UP.</div>
    <p class="sub">経営コンサルティング、広告PR、人材育成、組織経営支援、AIデータマーケティング。</p>
    <a href="#" class="cta">お問い合わせ →</a>
  </div>

  <div class="scroll-cue">
    <span>SCROLL</span>
    <div class="line"></div>
  </div>
</div>

<script>
class TextScramble {
  constructor(el){
    this.el = el;
    this.chars = 'アイウエオカキクケコサシスセソABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    this.update = this.update.bind(this);
  }
  setText(newText){
    const oldText = this.el.textContent;
    const length = Math.max(oldText.length, newText.length);
    const promise = new Promise((resolve) => this.resolve = resolve);
    this.queue = [];
    for (let i = 0; i < length; i++) {
      const from = oldText[i] || '';
      const to = newText[i] || '';
      const start = Math.floor(Math.random() * 20);
      const end = start + Math.floor(Math.random() * 20) + 8;
      this.queue.push({ from, to, start, end });
    }
    cancelAnimationFrame(this.frameRequest);
    this.frame = 0;
    this.update();
    return promise;
  }
  update(){
    let output = '';
    let complete = 0;
    for (let i = 0, n = this.queue.length; i < n; i++) {
      let { from, to, start, end, char } = this.queue[i];
      if (this.frame >= end) {
        complete++;
        output += to;
      } else if (this.frame >= start) {
        if (!char || Math.random() < 0.3) {
          char = this.chars[Math.floor(Math.random() * this.chars.length)];
          this.queue[i].char = char;
        }
        output += `<span style="opacity:0.6">${char}</span>`;
      } else {
        output += from;
      }
    }
    this.el.innerHTML = output;
    if (complete === this.queue.length) {
      this.resolve();
    } else {
      this.frameRequest = requestAnimationFrame(this.update);
      this.frame++;
    }
  }
}

const el = document.getElementById('scramble');
const fx = new TextScramble(el);
window.addEventListener('load', () => { fx.setText('PUSH IT UP.'); });
</script>

</body>
</html>
